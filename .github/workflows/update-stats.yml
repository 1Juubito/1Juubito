name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *"   # Roda todo dia à meia-noite (UTC)
  workflow_dispatch:        # Permite disparar manualmente pela aba Actions

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&count_private=true&hide_border=true&bg_color=0D0D0D&title_color=CC0000&icon_color=CC0000&text_color=AAAAAA
          path: profile/stats.svg
          # Troque GITHUB_TOKEN por secrets.STATS_TOKEN se estiver usando um PAT para count_private
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&hide_border=true&bg_color=0D0D0D&title_color=CC0000&text_color=AAAAAA
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit generated cards
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: atualiza cards de stats"
          file_pattern: "profile/*.svg"
