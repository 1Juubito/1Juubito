name: Gerar animação da cobrinha 🐍

on:
  # Roda automaticamente todo dia à meia-noite (UTC)
  schedule:
    - cron: "0 0 * * *"
  # Permite acionar manualmente pela aba "Actions" do repositório
  workflow_dispatch:
  # Roda também a cada push na branch principal
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Gerar os SVGs da cobrinha
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-dark
            dist/snake-light.svg

      - name: Publicar o resultado na branch "output"
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
